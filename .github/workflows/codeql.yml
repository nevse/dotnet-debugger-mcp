name: CodeQL

# Advanced setup rather than default setup: default setup skips a pull request that changes no
# file in an analyzed language, and the main ruleset then blocks it for want of CodeQL results.
# This workflow has no path filter, so every pull request gets an analysis.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Same languages, build mode and categories as the default setup this replaces, so the
        # existing alerts carry over
        language: [actions, csharp, python]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-extended

    - name: Analyze
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        category: /language:${{ matrix.language }}
