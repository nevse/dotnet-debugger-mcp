name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

# Read-only by default, so the build, test and lint jobs - which run third-party actions and the
# code under review - get a token that cannot write to the repository. package and registry declare
# the extra permissions they need themselves.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The debugger is a submodule and the build compiles it, so a shallow checkout of this
      # repository alone cannot build anything
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # Integration tests run in their own job so they are not executed twice
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal --filter "TestCategory!=Integration" --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results-${{ matrix.os }}
        path: '**/test-results.trx'

  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing should not hide the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The debugger is a submodule and the build compiles it, so a shallow checkout of this
      # repository alone cannot build anything
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # The test host is killed by a segfault inside libmscordbi while it replays the events for an
    # attach in roughly a fifth of macOS runs, and the integration tests attach around thirty times
    # each. Only that crash is retried: a test that merely fails is a result we want to see, so it
    # ends the job on the first attempt. At a fifth per attempt, three attempts leave under a percent
    # of runs red for a reason that is not ours.
    - name: Integration tests
      shell: bash
      run: |
        set -o pipefail
        attempt=1
        attempts=3

        while true; do
          log="integration-attempt-$attempt.log"

          if dotnet test --no-build --configuration Release --filter "TestCategory=Integration" --verbosity normal 2>&1 | tee "$log"; then
            exit 0
          fi

          # A host-level abort leaves no failing test behind, which is how it is told apart from one
          if grep -qE "Test host process crashed|Test Run Aborted" "$log" && [ "$attempt" -lt "$attempts" ]; then
            echo "::warning title=Test host crashed::Attempt $attempt of $attempts died in the debugger shim, retrying"
            attempt=$((attempt + 1))
            continue
          fi

          exit 1
        done

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The debugger is a submodule and the build compiles it, so a shallow checkout of this
      # repository alone cannot build anything
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    # Both checks are allowed to fail so that every one of them runs and reports its
    # findings; the gate below turns the collected results into the job status.
    # The submodule carries no .editorconfig of its own, so this repository's rules would be applied
    # to the debugger's sources - which are formatted to its conventions, not ours, and which nothing
    # here may reformat anyway
    - name: Check format
      id: format
      run: dotnet format --verify-no-changes --verbosity diagnostic --exclude external/
      continue-on-error: true

    - name: Run code analysis
      id: analysis
      run: dotnet build --no-restore /p:TreatWarningsAsErrors=true
      continue-on-error: true

    - name: Code quality gate
      if: always()
      env:
        FORMAT_OUTCOME: ${{ steps.format.outcome }}
        ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
      run: |
        status=0
        if [ "$FORMAT_OUTCOME" != "success" ]; then
          echo "::error title=Format::dotnet format reported violations (see the Check format step)"
          status=1
        fi
        if [ "$ANALYSIS_OUTCOME" != "success" ]; then
          echo "::error title=Analysis::Code analysis reported warnings as errors (see the Run code analysis step)"
          status=1
        fi
        if [ "$status" -eq 0 ]; then
          echo "All code quality checks passed."
        fi
        exit "$status"

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests]
    if: github.event_name == 'release'

    # Waits for a maintainer to approve the run before any step starts, and only runs for a v* tag.
    # nuget.org's trusted-publishing policy names this environment, so a run that was not approved
    # here - a release created with a stolen token, say - gets no key. See docs/RELEASING.md.
    environment: release

    outputs:
      version: ${{ steps.version.outputs.value }}

    # Naming any permission drops the defaults for this job, so contents has to be restated for the
    # release upload below
    permissions:
      id-token: write       # the OIDC token nuget.org trades for a short-lived key, and the attestation's signature
      contents: write       # attach the package to the release
      attestations: write   # record the build provenance of the package

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The debugger is a submodule and the build compiles it, so a shallow checkout of this
      # repository alone cannot build anything
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    # The release tag is the only place a version is written. One RID-agnostic package covers every
    # platform, because the native shim ships all of them, so there is nothing per-platform to build.
    - name: Read the version from the tag
      id: version
      run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    # NuGet.org reads this manifest to generate client configuration, and the MCP Registry matches
    # its version against the published package
    - name: Stamp the version into server.json
      run: |
        python3 - <<'PY'
        import json, os, pathlib
        version = os.environ["VERSION"]
        path = pathlib.Path("src/SharpDbg.MCP/.mcp/server.json")
        manifest = json.loads(path.read_text())
        manifest["version"] = version
        for package in manifest["packages"]:
            package["version"] = version
        path.write_text(json.dumps(manifest, indent=2) + "\n")
        PY
      env:
        VERSION: ${{ steps.version.outputs.value }}

    # The package README pins the version in every install command, so what nuget.org shows installs
    # this release and not whatever is newest when somebody reads it. It holds @VERSION@ until here.
    - name: Stamp the version into the package README
      run: |
        python3 - <<'PY'
        import os, pathlib
        path = pathlib.Path("docs/nuget-readme.md")
        text = path.read_text()
        if "@VERSION@" not in text:
            raise SystemExit("docs/nuget-readme.md has no @VERSION@ to stamp")
        path.write_text(text.replace("@VERSION@", os.environ["VERSION"]))
        PY
      env:
        VERSION: ${{ steps.version.outputs.value }}

    # The repository README pins a literal version, since stamping it would mean committing back from
    # here. Releasing a version it does not name would leave it pointing at the previous one, so the
    # release stops instead. scripts/release.sh bumps it in a pull request before tagging, with the
    # same script this runs.
    - name: Check the README pins this version
      run: python3 scripts/readme-version.py check "$VERSION"
      env:
        VERSION: ${{ steps.version.outputs.value }}

    # The registry job publishes this exact file, so what the registry advertises and what nuget
    # holds cannot drift apart
    - name: Keep the stamped manifest for the registry job
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: mcp-manifest
        path: src/SharpDbg.MCP/.mcp/server.json

    - name: Pack
      run: >
        dotnet pack src/SharpDbg.MCP/SharpDbg.MCP.csproj
        --configuration Release
        -p:Version=${{ steps.version.outputs.value }}
        --output ./artifacts

    # A signed statement that this workflow, at this commit, built this exact .nupkg, recorded by
    # GitHub and checked with: gh attestation verify <nupkg> --repo nevse/dotnet-debugger-mcp
    - name: Attest the package's build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ./artifacts/*.nupkg

    # Trusted publishing: nuget.org validates the workflow's OIDC token against a policy naming this
    # owner, repository, workflow file and environment, then issues an API key that lives an hour. No long-lived
    # secret is stored here. The key is requested immediately before the push on purpose.
    # Every action in these workflows is pinned to a commit, with its release in a comment, so a
    # moved tag cannot change what runs - here, with the token that publishes the package.
    # dependabot.yml moves the pins forward
    - name: Exchange the OIDC token for a NuGet key
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet.org
      run: >
        dotnet nuget push ./artifacts/*.nupkg
        --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate

    - name: Attach the package to the release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: ./artifacts/*.nupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The registry entry is a second publication: nothing about pushing to nuget.org updates it, and a
  # hand publish for 0.1.0 was still advertising that version after 0.1.1 shipped. It waits for
  # nuget to finish validating the push, so it runs after the package rather than beside it - as its
  # own workflow it spent part of its 30-minute budget on the build ahead of it, and the 0.2.0 run
  # was cancelled on that timeout while the README was still on its way.
  registry:
    name: MCP Registry
    runs-on: ubuntu-latest
    needs: [package]
    timeout-minutes: 25

    permissions:
      # The registry authenticates the io.github.nevse namespace from this token. No secret is
      # stored: the same OIDC exchange the NuGet push already relies on.
      id-token: write

    steps:
    # No checkout: the only file this needs is the manifest the package job stamped and shipped
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: mcp-manifest

    # The registry proves we own the name by reading the mcp-name marker out of the package README on
    # nuget.org, so there is nothing for it to verify until nuget has finished validating the push.
    # That took several minutes for 0.1.1.
    - name: Wait for nuget.org to serve the package README
      env:
        VERSION: ${{ needs.package.outputs.version }}
      run: |
        url="https://api.nuget.org/v3-flatcontainer/dotnetdebugger.mcp/${VERSION}/readme"

        for attempt in $(seq 1 40); do
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || echo 000)

          if [ "$code" = "200" ]; then
            echo "Served after $attempt attempt(s)"
            exit 0
          fi

          echo "attempt $attempt: HTTP $code"
          sleep 30
        done

        echo "::error::$url never became available, so the registry cannot verify the package"
        exit 1

    # Always the latest binary on purpose: an older one fails against the current registry with
    # "invalid audience", which reads like an authentication problem rather than a stale tool.
    # Pinned, and checked against the checksums the release publishes in registry_1.8.1_checksums.txt,
    # since this binary runs with the token that publishes the registry entry. Bump the version and
    # both checksums together.
    - name: Install mcp-publisher
      env:
        MCP_PUBLISHER_VERSION: v1.8.1
      run: |
        case "$(uname -m)" in
          x86_64)  arch=amd64; sha256=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc ;;
          aarch64) arch=arm64; sha256=8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4 ;;
          *) echo "::error::No pinned mcp-publisher for $(uname -m)"; exit 1 ;;
        esac

        curl -fsSLo mcp-publisher.tar.gz \
          "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_${arch}.tar.gz"
        echo "${sha256}  mcp-publisher.tar.gz" | sha256sum -c -
        tar xzf mcp-publisher.tar.gz mcp-publisher

    - name: Authenticate
      run: ./mcp-publisher login github-oidc

    - name: Publish
      run: ./mcp-publisher publish server.json

    - name: Report what the registry now holds
      if: always()
      run: |
        curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.nevse" \
          | python3 -m json.tool
