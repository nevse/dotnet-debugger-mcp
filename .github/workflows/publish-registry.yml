name: MCP Registry

# The registry entry is a second publication, separate from the NuGet package, and nothing about
# pushing to nuget.org updates it. Done by hand for 0.1.0, it was still reporting that version after
# 0.1.1 shipped, which is what this exists to stop happening again.
#
# A release publishes the registry entry from ci.yml's 'registry' job, which runs after the package
# is pushed. This is the recovery path only: a version already on nuget.org whose registry entry is
# missing or stale - a publish that failed, or a release cut before any of this existed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version already published to nuget.org, e.g. 0.1.1'
        required: true
        type: string

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # The registry authenticates the io.github.nevse namespace from this token. No secret is
      # stored: the same OIDC exchange the NuGet push already relies on.
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Through the environment rather than interpolated into the script, so the input cannot inject.
    - name: Resolve the version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        value="$INPUT_VERSION"

        case "$value" in
          '' | *[!0-9A-Za-z.+-]* )
            echo "::error::'$value' is not a package version"
            exit 1
            ;;
        esac

        echo "value=$value" >> "$GITHUB_OUTPUT"

    # The registry proves we own the name by reading the mcp-name marker out of the package README on
    # nuget.org, so there is nothing for it to verify until nuget has finished validating the push.
    # That took several minutes for 0.1.1, and on a release ci.yml is only pushing the package about
    # now, so this waits rather than failing on a package that is on its way.
    - name: Wait for nuget.org to serve the package README
      env:
        VERSION: ${{ steps.version.outputs.value }}
      run: |
        url="https://api.nuget.org/v3-flatcontainer/dotnetdebugger.mcp/${VERSION}/readme"

        for attempt in $(seq 1 40); do
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || echo 000)

          if [ "$code" = "200" ]; then
            echo "Served after $attempt attempt(s)"
            exit 0
          fi

          echo "attempt $attempt: HTTP $code"
          sleep 30
        done

        echo "::error::$url never became available, so the registry cannot verify the package"
        exit 1

    # Same rewrite ci.yml does before packing, and for the same reason: the committed manifest carries
    # 0.0.0-dev, and the registry matches its version against the published package.
    - name: Stamp the version into server.json
      env:
        VERSION: ${{ steps.version.outputs.value }}
      run: |
        python3 - <<'PY'
        import json, os, pathlib
        version = os.environ["VERSION"]
        path = pathlib.Path("src/DotnetDebugger.Mcp/.mcp/server.json")
        manifest = json.loads(path.read_text())
        manifest["version"] = version
        for package in manifest["packages"]:
            package["version"] = version
        path.write_text(json.dumps(manifest, indent=2) + "\n")
        PY

    # Always the latest binary on purpose: an older one fails against the current registry with
    # "invalid audience", which reads like an authentication problem rather than a stale tool.
    # Pinned, and checked against the checksums the release publishes in registry_1.8.1_checksums.txt,
    # since this binary runs with the token that publishes the registry entry. Bump the version and
    # both checksums together.
    - name: Install mcp-publisher
      env:
        MCP_PUBLISHER_VERSION: v1.8.1
      run: |
        case "$(uname -m)" in
          x86_64)  arch=amd64; sha256=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc ;;
          aarch64) arch=arm64; sha256=8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4 ;;
          *) echo "::error::No pinned mcp-publisher for $(uname -m)"; exit 1 ;;
        esac

        curl -fsSLo mcp-publisher.tar.gz \
          "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_${arch}.tar.gz"
        echo "${sha256}  mcp-publisher.tar.gz" | sha256sum -c -
        tar xzf mcp-publisher.tar.gz mcp-publisher

    - name: Authenticate
      run: ./mcp-publisher login github-oidc

    - name: Publish
      run: ./mcp-publisher publish src/DotnetDebugger.Mcp/.mcp/server.json

    - name: Report what the registry now holds
      if: always()
      run: |
        curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.nevse" \
          | python3 -m json.tool
